<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 930" role="img" aria-label="GS샵 부스터 프로 X2 2027년 5월 재방송 제안의 정적 콘텐츠 3면 스토리보드 v0.3. 세 번째 면은 내부 개선 제안 시안">
  <defs>
    <style>
      .bg{fill:#f5f2ef}.panel{fill:#fff;stroke:#e8e1dd;stroke-width:2}.red{fill:#df2738}.ink{fill:#202225}.muted{fill:#686a6f}.line{stroke:#ded8d5;stroke-width:2}.soft{fill:#fbf5f3}.soft2{fill:#f2f2f2}
      text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif}
      .small{font-size:20px;font-weight:500}.label{font-size:20px;font-weight:700;letter-spacing:1px}.body{font-size:24px;font-weight:600}.title{font-size:37px;font-weight:800}.big{font-size:44px;font-weight:800}.note{font-size:18px;font-weight:500}.note17{font-size:17px;font-weight:500}.q{font-size:21px;font-weight:700}.tiny{font-size:16px;font-weight:500}.num{font-size:17px;font-weight:800}
    </style>
  </defs>
  <rect width="1920" height="930" class="bg"/>
  <text x="80" y="69" class="label red">MEDICUBE × GS SHOP · PORTFOLIO CONCEPT · v0.3</text>
  <text x="80" y="118" class="title ink">2027년 5월 X2 재방송 제안 · 정적 콘텐츠 스토리보드</text>
  <text x="80" y="153" class="small muted">2026년 5월 9일 GS샵 첫 방송 1주년을 기준으로 기획한 배치 시안 · 2027년 실제 편성 및 혜택 미확정</text>

  <g transform="translate(80 195)">
    <rect width="550" height="640" rx="20" class="panel"/>
    <rect width="550" height="9" rx="4" class="red"/>
    <text x="30" y="53" class="label red">01 · 방송 전 예고 포스터</text>
    <text x="30" y="110" class="big ink">방송에서 다시 만나는</text>
    <text x="30" y="162" class="big ink">부스터 프로 X2</text>
    <rect x="30" y="192" width="490" height="247" rx="16" class="soft"/>
    <rect x="184" y="225" width="182" height="179" rx="25" fill="#efe4e1" stroke="#d4c4c0" stroke-dasharray="9 9" stroke-width="2"/>
    <text x="275" y="304" text-anchor="middle" class="small muted">공식 제품 이미지</text>
    <text x="275" y="338" text-anchor="middle" class="note muted">권리 확인 후 삽입</text>
    <text x="30" y="489" class="body ink">이번 방송 구성, 한눈에 확인</text>
    <text x="30" y="528" class="small muted">[방송 일시 확정 후 입력]</text>
    <rect x="30" y="553" width="490" height="57" rx="10" class="red"/>
    <text x="275" y="590" text-anchor="middle" class="body" fill="#fff">방송·상품 정보 확인하기</text>
  </g>

  <g transform="translate(685 195)">
    <rect width="550" height="640" rx="20" class="panel"/>
    <rect width="550" height="9" rx="4" class="red"/>
    <text x="30" y="53" class="label red">02 · 방송 구성 확인 카드</text>
    <text x="30" y="110" class="title ink">이번 방송 구성은</text>
    <text x="30" y="154" class="title ink">무엇인가요?</text>

    <rect x="30" y="182" width="490" height="72" rx="12" class="soft2"/>
    <circle cx="62" cy="206" r="15" class="red"/>
    <text x="62" y="213" text-anchor="middle" class="num" fill="#fff">1</text>
    <text x="90" y="212" class="q ink">본품</text>
    <text x="90" y="238" class="note muted">부스터 프로 X2 [확정 색상·모델]</text>

    <rect x="30" y="262" width="490" height="72" rx="12" class="soft2"/>
    <circle cx="62" cy="286" r="15" class="red"/>
    <text x="62" y="293" text-anchor="middle" class="num" fill="#fff">2</text>
    <text x="90" y="292" class="q ink">함께 구성</text>
    <text x="90" y="318" class="note muted">[확정 앰플·젤 목록]</text>

    <rect x="30" y="342" width="490" height="72" rx="12" class="soft2"/>
    <circle cx="62" cy="366" r="15" class="red"/>
    <text x="62" y="373" text-anchor="middle" class="num" fill="#fff">3</text>
    <text x="90" y="372" class="q ink">보관·부속</text>
    <text x="90" y="398" class="note muted">[케이스·뚜껑·거치대·케어수건 포함 여부]</text>

    <rect x="30" y="422" width="490" height="72" rx="12" class="soft2"/>
    <circle cx="62" cy="446" r="15" class="red"/>
    <text x="62" y="453" text-anchor="middle" class="num" fill="#fff">4</text>
    <text x="90" y="452" class="q ink">가격·혜택</text>
    <text x="90" y="478" class="note muted">[승인 조건]</text>

    <text x="30" y="522" class="tiny muted">근거: 리뷰 221건 · 구매 SKU 11종 · 부속품 부재 7건(3.2%)</text>
    <rect x="30" y="553" width="490" height="57" rx="10" class="red"/>
    <text x="275" y="590" text-anchor="middle" class="body" fill="#fff">구성·주의사항 자세히 보기</text>
  </g>

  <g transform="translate(1290 195)">
    <rect width="550" height="640" rx="20" class="panel"/>
    <rect width="550" height="9" rx="4" class="red"/>
    <text x="30" y="53" class="label red">03 · 내부용 개선 과제 카드</text>
    <text x="30" y="110" class="title ink">리뷰에서 발견한</text>
    <text x="30" y="154" class="title ink">X2 개선 검토 과제</text>

    <rect x="30" y="182" width="490" height="100" rx="12" class="soft2"/>
    <rect x="30" y="182" width="6" height="100" rx="3" class="red"/>
    <text x="52" y="212" class="q ink">사용감·강도 검토</text>
    <text x="52" y="244" class="note17 muted">자극·통증 언급 12건</text>
    <text x="52" y="268" class="note17 muted">안전성·사용성 시험을 거쳐 판단</text>

    <rect x="30" y="292" width="490" height="100" rx="12" class="soft2"/>
    <rect x="30" y="292" width="6" height="100" rx="3" class="red"/>
    <text x="52" y="322" class="q ink">무게·그립·버튼 설계 검토</text>
    <text x="52" y="354" class="note17 muted">무게 10건 · 버튼 관련 5건</text>
    <text x="52" y="378" class="note17 muted">원인 확인과 제조 가능성 검토</text>

    <rect x="30" y="402" width="490" height="100" rx="12" class="soft2"/>
    <rect x="30" y="402" width="6" height="100" rx="3" class="red"/>
    <text x="52" y="432" class="q ink">설명서·구성 정보 검토</text>
    <text x="52" y="464" class="note17 muted">설명 혼란 6건 · 부속품 부재 7건</text>
    <text x="52" y="488" class="note17 muted">표시 개선과 실제 구성 변경은 별도 결정</text>

    <text x="30" y="524" class="tiny muted">내부 검토 시안 · 개선 완료·출시·방송 편성 미확정</text>
    <rect x="30" y="553" width="490" height="57" rx="10" class="red"/>
    <text x="275" y="590" text-anchor="middle" class="body" fill="#fff">변경 사양 검증 후 고객용 제작</text>
  </g>

  <text x="80" y="884" class="note muted">포트폴리오 시안 · 2027년 편성·제품 개선·혜택 미확정 · 화면 3은 내부 제안 · 실제 광고 게시 전 제품·법무·채널 검수</text>
</svg>
